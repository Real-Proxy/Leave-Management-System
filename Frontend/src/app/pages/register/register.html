<h2>Register</h2>

<form (ngSubmit)="register()">
  <label>Name</label><br />
  <input [(ngModel)]="name" name="name" required /><br /><br />

  <label>Email</label><br />
  <input type="email" [(ngModel)]="email" name="email" required /><br /><br />

  <label>Password</label><br />
  <input type="password" [(ngModel)]="password" name="password" required /><br /><br />

  <label>Role</label><br />
  <select [(ngModel)]="role" name="role">
    <option [value]="1">Employee</option>
    <option [value]="2">Manager</option>
  </select><br /><br />

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Registering...' : 'Register' }}
  </button>

  <p style="color:red" *ngIf="error">{{ error }}</p>
</form>
