<div class="max-w-4xl mx-auto p-4 md:p-8">
  <div class="bg-white rounded-xl shadow-lg overflow-hidden md:flex">

    <!-- Left Side: Calendar -->
    <div class="md:w-1/2 p-6 bg-gray-50 border-r border-gray-100">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Select Dates</h3>
      <app-calendar [leaves]="existingLeaves" [selectionMode]="true" (rangeSelected)="onRangeSelected($event)">
      </app-calendar>

      <p class="mt-4 text-sm text-gray-500 text-center">
        Click start date, then click end date.
      </p>
    </div>

    <!-- Right Side: Form -->
    <div class="md:w-1/2 p-6">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Details</h2>

      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Leave Type</label>
          <select [(ngModel)]="leave.leaveTypeId"
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
            <option *ngFor="let type of leaveTypes" [value]="type.id">{{ type.name }} ({{ type.defaultQuota }} days)
            </option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">From</label>
            <div class="mt-1 p-2 bg-gray-100 rounded text-gray-800 text-sm font-mono">
              {{ leave.fromDate || 'Select...' }}
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">To</label>
            <div class="mt-1 p-2 bg-gray-100 rounded text-gray-800 text-sm font-mono">
              {{ leave.toDate || 'Select...' }}
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Reason</label>
          <textarea [(ngModel)]="leave.reason" rows="3"
            class="mt-1 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border border-gray-300 rounded-md"
            placeholder="Why do you need leave?"></textarea>
        </div>

        <button (click)="submit()" [disabled]="!leave.fromDate || !leave.toDate || !leave.reason"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
          Submit Request
        </button>
      </div>
    </div>
  </div>
</div>
