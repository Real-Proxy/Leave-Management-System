<div class="w-full max-w-md mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-b border-gray-200">
        <button (click)="prevMonth()" class="p-1 rounded-full hover:bg-gray-200 focus:outline-none">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <span class="text-lg font-semibold text-gray-800">
            {{ currentDate | date:'MMMM yyyy' }}
        </span>
        <button (click)="nextMonth()" class="p-1 rounded-full hover:bg-gray-200 focus:outline-none">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>

    <!-- Grid -->
    <div class="p-4">
        <!-- Days of Week -->
        <div class="grid grid-cols-7 mb-2 text-center">
            <div *ngFor="let day of weekDays" class="text-xs font-bold text-gray-500 uppercase tracking-wide">
                {{ day }}
            </div>
        </div>

        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-1">
            <!-- Padding -->
            <div *ngFor="let pad of paddingDays" class="h-10"></div>

            <!-- Date Cells -->
            <button *ngFor="let date of daysInMonth" (click)="onDateClick(date)" (mouseenter)="onDateHover(date)"
                [disabled]="isPastDate(date)"
                [class]="'h-10 w-full flex items-center justify-center rounded-md text-sm transition-colors duration-150 relative ' + getLeaveStatusClasses(date) + (isToday(date) ? ' ring-2 ring-indigo-400 ring-offset-1' : '') + (isPastDate(date) ? ' opacity-40 cursor-not-allowed' : ' cursor-pointer')">

                {{ date | date:'d' }}

            </button>
        </div>
    </div>

    <div class="px-4 py-2 bg-gray-50 text-xs text-gray-500 border-t flex justify-between">
        <div class="flex items-center gap-1"><span
                class="w-3 h-3 bg-green-100 rounded-full border border-green-200"></span> Approved</div>
        <div class="flex items-center gap-1"><span
                class="w-3 h-3 bg-yellow-100 rounded-full border border-yellow-200"></span> Pending</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 bg-red-100 rounded-full border border-red-200"></span>
            Rejected</div>
    </div>
</div>
