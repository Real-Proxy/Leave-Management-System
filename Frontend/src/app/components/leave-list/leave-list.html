<div class="card">
  <h2>My Leaves</h2>

  <div *ngIf="leaves.length === 0" class="empty">
    No leaves found
  </div>

  <ul class="leave-list">
    <li *ngFor="let l of leaves" class="leave-item">
      <div class="dates">
        {{ l.fromDate | date:'dd-MM-yyyy' }} → {{ l.toDate | date:'dd-MM-yyyy' }}
      </div>
      <span class="status" [class.approved]="l.status === 'Approved'"
                          [class.pending]="l.status === 'Pending'">
        {{ l.status }}
      </span>
    </li>
  </ul>
</div>
